name: Security gate
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 1 * *' # monthly: ships no third-party dependencies; re-runs the rule-based baseline and the WordPress checks (WP latest)
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  baseline:
    uses: ./.github/workflows/cybersecurity.yml # zizmor: ignore[self-repository] -- Reusable checks must follow the candidate commit.
  wordpress:
    uses: ./.github/workflows/wordpress-checks.yml # zizmor: ignore[self-repository] -- Same-commit runtime checks.
  gate:
    name: All security checks passed
    if: ${{ always() }}
    needs: [baseline, wordpress]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
